<!-- AI-assisted: written with Claude (Fable 5.2) and Claude Code (Opus 5.5), reviewed by the team. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WALKBACK: a Marswalk (EVA) planner for the Mount Sharp boxwork in Gale Crater, built on NASA data.">
  <title>WALKBACK: a Marswalk planner for the Mount Sharp boxwork</title>

  <!-- Leaflet 1.9.4: the open-source map library, loaded from the unpkg CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- IBM Plex type (open licence, via the same unpkg CDN). If it cannot load, system fonts are used. -->
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/ibm-plex-sans@5.2.8/latin-400.css">
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/ibm-plex-sans@5.2.8/latin-500.css">
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/ibm-plex-sans@5.2.8/latin-600.css">
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/ibm-plex-sans@5.2.8/latin-700.css">
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/ibm-plex-mono@5.2.7/latin-400.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- TOP BAR: project name and tagline -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-name" id="brand-name">WALKBACK</span>
      <span class="brand-tagline" id="brand-tagline">Plan the walk out. Know the walk back.</span>
    </div>
    <div class="topbar-right">
      <span class="site-label">Mount Sharp boxwork · Gale Crater · Mars</span>
      <!-- Reopens the welcome screen (js/intro.js). -->
      <button class="topbar-btn" id="intro-open" type="button">About</button>
      <!-- Opens the helmet HUD (js/hud.js). Disabled until the route data has loaded. -->
      <button class="hud-open-btn" id="hud-open" type="button" disabled aria-label="Open the helmet HUD view">Helmet view</button>
    </div>
  </header>

  <!-- MAIN AREA: the map on the left, the information panel on the right -->
  <main class="layout">

    <section class="map-wrap" aria-label="Map of the Marswalk site">
      <div id="map"></div>

      <!-- North arrow. The map is always north-up. -->
      <div class="north-arrow" role="img" aria-label="North is up" title="North is up">
        <svg viewBox="0 0 40 52" width="34" height="44" role="img" aria-hidden="true">
          <polygon points="20,2 30,30 20,24 10,30" fill="#e6edf3" stroke="#0b0f14" stroke-width="1.5"/>
          <text x="20" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3" stroke="#0b0f14" stroke-width="0.4">N</text>
        </svg>
      </div>

      <!-- Latitude / longitude under the mouse pointer -->
      <div class="coord-readout" id="coord-readout" aria-live="off">Move the pointer over the map</div>

      <!-- Shown only if the page cannot load its data files -->
      <div class="map-message" id="map-message" hidden></div>
    </section>

    <aside class="panel" aria-label="Plan details">
      <nav class="tabs" role="tablist" aria-label="Panel sections">
        <button class="tab is-active" role="tab" aria-selected="true"  aria-controls="tab-plan"       id="tabbtn-plan"       data-tab="plan">Plan</button>
        <button class="tab"           role="tab" aria-selected="false" aria-controls="tab-stops"      id="tabbtn-stops"      data-tab="stops">Stops</button>
        <button class="tab"           role="tab" aria-selected="false" aria-controls="tab-conditions" id="tabbtn-conditions" data-tab="conditions">Conditions</button>
        <button class="tab"           role="tab" aria-selected="false" aria-controls="tab-sources"    id="tabbtn-sources"    data-tab="sources">Sources</button>
      </nav>

      <!-- Tab bodies. They are filled in by later build steps. -->
      <section class="tab-body is-active" role="tabpanel" id="tab-plan"       aria-labelledby="tabbtn-plan"></section>
      <section class="tab-body"           role="tabpanel" id="tab-stops"      aria-labelledby="tabbtn-stops"      hidden></section>
      <section class="tab-body"           role="tabpanel" id="tab-conditions" aria-labelledby="tabbtn-conditions" hidden></section>
      <section class="tab-body"           role="tabpanel" id="tab-sources"    aria-labelledby="tabbtn-sources"    hidden></section>

      <footer class="panel-footer">
        Student project for the 2026 NASA Space Apps Challenge. Not affiliated with or endorsed by NASA.
      </footer>
    </aside>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/stops.js"></script>
  <script src="js/conditions.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/cuff.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
